<script>
const DISPATCH_WORKFLOW = ['派工', '施工', '驗收', '請款', '付款'];
function bindDispatchEvents() {
  $('#openDispatchBtn').addEventListener('click', openDispatchDialog);
  $$('.close-dispatch-dialog').forEach(btn =>
    btn.addEventListener('click', () => $('#dispatchDialog').close()));
  $('#dispatchForm').addEventListener('submit', submitDispatch);
$('#refreshDispatchBtn').addEventListener('click', () => {
    state.adminHistoryLimit = 10;
    loadDispatch();
  });
  $('#loadMoreAdminHistoryBtn').addEventListener('click', () => {
    state.adminHistoryLimit += 10;
    renderAdminDispatchHistory();
  });
  $('#dispatchStatus').addEventListener('change', () =>
    renderWorkflowProgress('#dispatchProgressBar', $('#dispatchStatus').value));
  $('#dispatchTaskList').addEventListener('click', event => {
    const button = event.target.closest('.edit-dispatch-task');
    if (button) openDispatchEditDialog(button.dataset.taskId);
  });
}

async function loadDispatch() {
  if (state.user.role !== 'ADMIN') return;
  setLoading(true);
  try {
    state.dispatchData = await gas('getDispatchBootstrap', state.token);
    renderDispatch();
  } catch (e) {
    toast(errorText(e), true);
  } finally {
    setLoading(false);
  }
}

function renderDispatch() {
  const tasks = state.dispatchData?.tasks || [];
  $('#dispatchTotalCount').textContent = tasks.length;
  $('#dispatchPendingCount').textContent =
    tasks.filter(task => task.status === '待接單').length;
  $('#dispatchActiveCount').textContent = tasks.filter(task =>
    ['已接單', '施工中', '待驗收'].includes(task.status)).length;
  $('#dispatchQuoteTotal').textContent =
    money(tasks.reduce((sum, task) => sum + task.totalQuote, 0));
  const activeTasks = tasks.filter(task => !isCompletedDispatchHistory(task.status));
  $('#dispatchTaskList').innerHTML = activeTasks.length
    ? activeTasks.map(dispatchTaskCard).join('')
    : '<div class="empty">目前沒有進行中的派工任務；已完工工單可在下方回查。</div>';
  renderAdminDispatchHistory();
}

function renderAdminDispatchHistory() {
  const table = $('#adminDispatchHistoryTable');
  if (!table) return;
  const rows = (state.dispatchData?.tasks || [])
    .filter(task => isCompletedDispatchHistory(task.status))
    .sort((a, b) => String(b.scheduledDate).localeCompare(String(a.scheduledDate)));
  const shown = rows.slice(0, state.adminHistoryLimit);
  table.innerHTML = shown.length
    ? shown.map(dispatchHistoryTableRow).join('')
    : '<tr><td colspan="7" class="empty">目前沒有已完工派工記錄</td></tr>';
  $('#adminDispatchHistoryMobile').innerHTML = shown.length
    ? shown.map(dispatchHistoryCard).join('')
    : '<div class="empty">目前沒有已完工派工記錄</div>';
  updateHistoryLoadMore('admin', shown.length, rows.length);
}
function dispatchTaskCard(task) {
  const items = task.workItems.map(item =>
    '<li>' + escapeHtml(item.content) + '</li>').join('');
  const employees = task.assignees.map(employee =>
    '<span class="assignee-chip">' + escapeHtml(employee.name) + '</span>').join('');
  const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent(task.address);
  return '<article class="dispatch-card">' +
    '<div class="dispatch-card-head"><div><small>' + escapeHtml(task.id) +
    '</small><h3>' + escapeHtml(task.name) + '</h3></div><span class="chip">' +
    escapeHtml(task.status) + '</span></div>' +
    '<a class="dispatch-address" href="' + mapUrl +
    '" target="_blank" rel="noopener"><span class="material-symbols-rounded">location_on</span>' +
    escapeHtml(task.address) + '</a>' +
    '<div class="dispatch-meta"><span>預定 ' + escapeHtml(task.scheduledDate) +
    '</span><span>工程報價 ' + money(task.totalQuote) + '</span></div>' +
    workflowProgressHtml(task.status) +
    '<ol class="dispatch-items">' + items + '</ol>' +
    '<div class="assignee-row">' + employees + '</div>' +
    (task.note ? '<p class="dispatch-note">' + escapeHtml(task.note) + '</p>' : '') +
    (isDispatchLockedStatusClient(task.status)
      ? '<div class="dispatch-card-actions"><span class="locked-hint">已結案，停止修改</span></div>'
      : '<div class="dispatch-card-actions"><button type="button" class="btn outlined small edit-dispatch-task" data-task-id="' + escapeHtml(task.id) + '"><span class="material-symbols-rounded">edit</span>修改派工</button></div>') +
    '</article>';
}

async function openDispatchDialog() {
  if (!state.dispatchData) await loadDispatch();
  state.editingDispatchTaskId = '';
  const form = $('#dispatchForm');
  form.reset();
  $('#dispatchDialogTitle').textContent = '新增派工';
  $('#dispatchDialogSubtitle').textContent = '建立後將寫入派工專用工作表';
  $('#submitDispatchBtn').textContent = '建立派工';
  $('#dispatchWorkSection').classList.remove('hidden');
  $('#dispatchEmployeeSection').classList.remove('hidden');
  $('#dispatchEditNotice').classList.add('hidden');
  $('#dispatchReadOnlyWorkSection').classList.add('hidden');
  $('#dispatchProgressSection').classList.add('hidden');
  $('#dispatchDate').value = new Date().toLocaleDateString('en-CA');
  renderDispatchAddresses();
  renderDispatchWorkTypes();
  renderDispatchEmployees();
  setDispatchCreateFieldsEnabled(true);
  $('#dispatchDialog').showModal();
}

function openDispatchEditDialog(taskId) {
  const task = state.dispatchData?.tasks?.find(item => item.id === taskId);
  if (!task) return toast('找不到派工資料，請重新整理。', true);
  if (isDispatchLockedStatusClient(task.status)) return toast('此工單已結案，不可修改。', true);
  state.editingDispatchTaskId = task.id;
  const form = $('#dispatchForm');
  form.reset();
  renderDispatchAddresses();
  $('#dispatchDialogTitle').textContent = '修改派工';
  $('#dispatchDialogSubtitle').textContent = task.id + '｜工作內容與指派員工保持原樣';
  $('#submitDispatchBtn').textContent = '儲存修改';
  $('#dispatchWorkSection').classList.add('hidden');
  $('#dispatchEmployeeSection').classList.add('hidden');
  setDispatchCreateFieldsEnabled(false);
  $('#dispatchEditNotice').classList.remove('hidden');
  $('#dispatchReadOnlyWorkSection').classList.remove('hidden');
  $('#dispatchProgressSection').classList.remove('hidden');
  $('#dispatchReadOnlyWorkItems').innerHTML = task.workItems.map(item =>
    '<li><span class="material-symbols-rounded">task_alt</span><span>' +
    escapeHtml(item.content) + '</span></li>').join('');
  renderDispatchStatusOptions(task.status);
  $('#dispatchProjectName').value = task.name;
  $('#dispatchDate').value = String(task.scheduledDate || '').replaceAll('/', '-');
  form.elements.customerName.value = task.customerName || '';
  form.elements.customerPhone.value = task.customerPhone || '';
  $('#dispatchWorkQuote').value = task.workQuote || 0;
  form.elements.note.value = task.note || '';
  const select = $('#dispatchAddressSelect');
  if ([...select.options].some(option => option.value === task.address)) {
    select.value = task.address;
    toggleCustomDispatchAddress();
  } else {
    select.value = state.dispatchData?.otherAddressValue || '__OTHER_ADDRESS__';
    toggleCustomDispatchAddress();
    $('#customDispatchAddress').value = task.address;
  }
  $('#dispatchDialog').showModal();
}

/**
 * 修改派工時停用新增專用欄位，避免隱藏的 required 欄位阻擋表單送出。
 */
function setDispatchCreateFieldsEnabled(enabled) {
  ['#dispatchWorkSection', '#dispatchEmployeeSection'].forEach(selector => {
    $$('input, select, textarea', $(selector)).forEach(field => {
      field.disabled = !enabled;
    });
  });
  if (!enabled) {
    $('#customWorkType').required = false;
    $('#customWorkType').value = '';
  }
}
function isDispatchLockedStatusClient(status) {
  return ['已結案', '完工結案', '付款'].includes(String(status || '').trim());
}

function renderDispatchAddresses() {
  const projects = state.dispatchData?.projectAddresses || [];
  const otherValue = state.dispatchData?.otherAddressValue || '__OTHER_ADDRESS__';
  const options = projects.map(project =>
    '<option value="' + escapeHtml(project.address) + '" data-name="' +
    escapeHtml(project.name) + '">' +
    escapeHtml((project.name ? project.name + '｜' : '') + project.address) +
    '</option>').join('');
  $('#dispatchAddressSelect').innerHTML =
    '<option value="">請選擇工程地址</option>' + options +
    '<option value="' + escapeHtml(otherValue) + '">其它（自行輸入）</option>';
  $('#dispatchAddressSelect').onchange = toggleCustomDispatchAddress;
  toggleCustomDispatchAddress();
}

function toggleCustomDispatchAddress() {
  const select = $('#dispatchAddressSelect');
  const otherValue = state.dispatchData?.otherAddressValue || '__OTHER_ADDRESS__';
  const isCustom = select.value === otherValue;
  $('#customDispatchAddressField').classList.toggle('hidden', !isCustom);
  $('#customDispatchAddress').required = isCustom;
  if (!isCustom) {
    $('#customDispatchAddress').value = '';
    const selectedName = select.selectedOptions[0]?.dataset.name || '';
    if (selectedName && !$('#dispatchProjectName').value.trim()) {
      $('#dispatchProjectName').value = selectedName;
    }
  }
}

function renderDispatchWorkTypes() {
  const workTypes = state.dispatchData?.workTypes || [];
  const otherValue = state.dispatchData?.otherWorkTypeValue || '__OTHER_WORK__';
  const options = workTypes.map(type =>
    '<label class="work-type-option"><input class="work-type-checkbox" type="checkbox" value="' +
    escapeHtml(type) +
    '"><span class="material-symbols-rounded">check_box_outline_blank</span><strong>' +
    escapeHtml(type) + '</strong></label>').join('');
  const otherOption =
    '<label class="work-type-option"><input class="work-type-checkbox" type="checkbox" value="' +
    escapeHtml(otherValue) +
    '"><span class="material-symbols-rounded">check_box_outline_blank</span><strong>其它</strong></label>';
  $('#dispatchWorkTypeOptions').innerHTML = options + otherOption;
  $$('.work-type-checkbox', $('#dispatchWorkTypeOptions')).forEach(input =>
    input.addEventListener('change', () => {
      input.nextElementSibling.textContent =
        input.checked ? 'check_box' : 'check_box_outline_blank';
      input.closest('.work-type-option').classList.toggle('selected', input.checked);
      toggleCustomWorkType();
    })
  );
  toggleCustomWorkType();
}

function toggleCustomWorkType() {
  const otherValue = state.dispatchData?.otherWorkTypeValue || '__OTHER_WORK__';
  const other = $$('.work-type-checkbox', $('#dispatchWorkTypeOptions'))
    .find(input => input.value === otherValue);
  const enabled = Boolean(other?.checked);
  $('#customWorkTypeField').classList.toggle('hidden', !enabled);
  $('#customWorkType').required = enabled;
  if (!enabled) $('#customWorkType').value = '';
}

function renderDispatchEmployees() {
  const employees = state.dispatchData?.employees || [];
  $('#dispatchEmployeeOptions').innerHTML = employees.length
    ? employees.map(employee =>
      '<label class="employee-option"><input type="checkbox" value="' +
      escapeHtml(employee.email) + '"><span><strong>' + escapeHtml(employee.name) +
      '</strong><small>' + escapeHtml(employee.email) + '</small></span></label>').join('')
    : '<div class="empty">尚無啟用的一般員工，請先到報帳_員工新增 EMPLOYEE 帳號。</div>';
}

async function submitDispatch(e) {
  e.preventDefault();
  const button = $('#submitDispatchBtn');
  button.disabled = true;
  button.textContent = state.editingDispatchTaskId ? '儲存中…' : '建立中…';
  try {
    const data = Object.fromEntries(new FormData(e.target).entries());
    const selectedAddress = $('#dispatchAddressSelect').value;
    const otherAddressValue =
      state.dispatchData?.otherAddressValue || '__OTHER_ADDRESS__';
    data.address = selectedAddress === otherAddressValue
      ? $('#customDispatchAddress').value.trim()
      : selectedAddress;
    if (!data.address) throw new Error('請選擇或輸入工程地址。');
    if (state.editingDispatchTaskId) {
      data.taskId = state.editingDispatchTaskId;
      const result = await gas('updateDispatchTask', data, state.token);
      toast(result.message);
      state.editingDispatchTaskId = '';
      $('#dispatchDialog').close();
      await loadDispatch();
      return;
    }
    data.materialQuote = 0;
    data.allocationTotal = 0;

    const otherValue = state.dispatchData?.otherWorkTypeValue || '__OTHER_WORK__';
    const selectedWorkTypes =
      $$('.work-type-checkbox:checked', $('#dispatchWorkTypeOptions'))
        .map(input => input.value);
    data.workItems = selectedWorkTypes.filter(value => value !== otherValue);
    if (selectedWorkTypes.includes(otherValue)) {
      const customWorkType = $('#customWorkType').value.trim();
      if (!customWorkType) throw new Error('請輸入其它工作內容。');
      data.workItems.push(customWorkType);
    }

    data.assigneeEmails =
      $$('input[type="checkbox"]:checked', $('#dispatchEmployeeOptions'))
        .map(input => input.value);
    const result = await gas('createDispatchTask', data, state.token);
    toast(result.message + ' 編號：' + result.id);
    $('#dispatchDialog').close();
    await loadDispatch();
  } catch (err) {
    toast(errorText(err), true);
  } finally {
    button.disabled = false;
    button.textContent = state.editingDispatchTaskId ? '儲存修改' : '建立派工';
  }
}

function normalizeDispatchStage(status) {
  const value = String(status || '').trim();
  if (['待接單', '已接單', '派工'].includes(value)) return '派工';
  if (['施工中', '進行中', '施工'].includes(value)) return '施工';
  if (['待驗收', '驗收'].includes(value)) return '驗收';
  if (['已完成', '請款'].includes(value)) return '請款';
  if (['已結案', '完工結案', '付款'].includes(value)) return '付款';
  return '派工';
}

function workflowProgressHtml(status) {
  const current = normalizeDispatchStage(status);
  const currentIndex = DISPATCH_WORKFLOW.indexOf(current);
  return '<div class="workflow-progress compact">' + DISPATCH_WORKFLOW.map((stage, index) =>
    '<div class="workflow-step ' + (index < currentIndex ? 'done' : index === currentIndex ? 'active' : '') + '">' +
    '<span>' + (index < currentIndex ? '✓' : index + 1) + '</span><small>' + stage + '</small></div>'
  ).join('') + '</div>';
}

function renderWorkflowProgress(selector, status) {
  $(selector).outerHTML = workflowProgressHtml(status).replace(
    'class="workflow-progress compact"', 'id="dispatchProgressBar" class="workflow-progress"');
}

function renderDispatchStatusOptions(status) {
  const current = normalizeDispatchStage(status);
  const editableStages = DISPATCH_WORKFLOW.filter(stage => stage !== '付款' || current === '付款');
  $('#dispatchStatus').innerHTML = editableStages.map(stage =>
    '<option value="' + stage + '"' + (stage === current ? ' selected' : '') + '>' +
    stage + '</option>').join('');
  renderWorkflowProgress('#dispatchProgressBar', current);
}</script>
