<div class="page-head">
  <div><p class="eyebrow">ADMIN</p><h2><span id="dispatchPageUserName"></span>｜老闆派工</h2><p>派工、審核、薪資結算與工程管理</p></div>
  <button id="openDispatchBtn" class="btn primary"><span class="material-symbols-rounded">add_task</span>新增派工</button>
</div>

<div class="stat-grid dispatch-stats">
  <article class="stat-card"><span class="material-symbols-rounded blue">assignment</span><div><small>全部任務</small><strong id="dispatchTotalCount">0</strong></div></article>
  <article class="stat-card"><span class="material-symbols-rounded amber">pending_actions</span><div><small>待接單</small><strong id="dispatchPendingCount">0</strong></div></article>
  <article class="stat-card"><span class="material-symbols-rounded purple">engineering</span><div><small>進行中</small><strong id="dispatchActiveCount">0</strong></div></article>
  <article class="stat-card"><span class="material-symbols-rounded green">request_quote</span><div><small>報價總額</small><strong id="dispatchQuoteTotal">NT$ 0</strong></div></article>
</div>

<section class="card">
  <div class="card-title"><h3>派工任務</h3><button id="refreshDispatchBtn" class="icon-btn" title="重新整理"><span class="material-symbols-rounded">refresh</span></button></div>
  <div id="dispatchTaskList" class="dispatch-list"><div class="empty">尚無派工任務</div></div>
</section>
<section class="card dispatch-history-section">
  <div class="card-title"><div><h3>派工完工歷史回查</h3><p>請款與付款階段的已完工工單</p></div></div>
  <div id="adminDispatchHistoryMobile" class="mobile-list"></div>
  <div class="table-wrap desktop-table">
    <table class="history-table"><thead><tr><th>日期</th><th>工程</th><th>地點</th><th>工作內容</th><th class="right">工程報價</th><th class="right">報帳金額</th><th class="right">合計</th></tr></thead><tbody id="adminDispatchHistoryTable"></tbody></table>
  </div>
  <div class="history-load-row"><small id="adminHistoryCount"></small><button id="loadMoreAdminHistoryBtn" type="button" class="btn outlined small hidden">再顯示 10 筆</button></div>
</section>

<dialog id="dispatchReviewDialog" class="dispatch-review-dialog">
  <form method="dialog">
    <div class="dialog-head"><div><small id="dispatchReviewTaskCode"></small><h3 id="dispatchReviewTitle">完工回報審核</h3></div><button type="button" class="icon-btn close-dispatch-review"><span class="material-symbols-rounded">close</span></button></div>
    <div id="dispatchReviewContent" class="review-content"><div class="empty">正在載入回報內容…</div></div>
    <div class="dialog-actions"><button type="button" class="btn text close-dispatch-review">關閉</button></div>
  </form>
</dialog>
<dialog id="dispatchDialog" class="dispatch-dialog">
  <form id="dispatchForm" method="dialog">
    <div class="dialog-head">
      <div><h3 id="dispatchDialogTitle">新增派工</h3><small id="dispatchDialogSubtitle">建立後將寫入派工專用工作表</small></div>
      <button type="button" class="icon-btn close-dispatch-dialog"><span class="material-symbols-rounded">close</span></button>
    </div>
    <div class="form-grid">
      <label>工程名稱<span>*</span><input id="dispatchProjectName" name="name" maxlength="100" placeholder="例如：中和連城路退租整理" required></label>
      <label>預定日期<span>*</span><input id="dispatchDate" name="scheduledDate" type="date" required></label>
      <label class="wide">工程地址<span>*</span><select id="dispatchAddressSelect" required></select></label>
      <label id="customDispatchAddressField" class="wide hidden">其它工程地址<span>*</span><input id="customDispatchAddress" maxlength="200" placeholder="例如：中和連城路75巷3弄3號5樓"></label>
      <label>客戶名稱<input name="customerName" maxlength="100" placeholder="選填"></label>
      <label>客戶電話<input name="customerPhone" maxlength="50" inputmode="tel" placeholder="選填"></label>

      <div id="dispatchWorkSection" class="wide form-section">
        <div class="section-title">
          <strong>工作內容<span>*</span></strong>
          <small>可複選</small>
        </div>
        <div id="dispatchWorkTypeOptions" class="work-type-options"></div>
        <label id="customWorkTypeField" class="custom-work-type hidden">
          其它工作內容<span>*</span>
          <input id="customWorkType" maxlength="300" placeholder="例如：清運家具、修補磁磚">
        </label>
      </div>

      <section id="dispatchReadOnlyWorkSection" class="wide form-section hidden">
        <div class="section-title"><strong>工作任務內容</strong><small>僅供查看，不可修改</small></div>
        <ol id="dispatchReadOnlyWorkItems" class="readonly-work-items"></ol>
      </section>

      <section id="dispatchProgressSection" class="wide form-section hidden">
        <div class="section-title"><strong>工程進度</strong><small>選擇目前階段</small></div>
        <div id="dispatchProgressBar" class="workflow-progress"></div>
        <label>目前進度<select id="dispatchStatus" name="status"></select></label>
      </section>
      <div id="dispatchEmployeeSection" class="wide form-section">
        <div class="section-title"><strong>指派員工<span>*</span></strong><small>可複選</small></div>
        <div id="dispatchEmployeeOptions" class="employee-options"></div>
      </div>

            <div id="dispatchEditNotice" class="wide dispatch-edit-notice hidden">修改基本資料時，工作內容與指派員工保持原樣。</div>
      <label class="wide">工程報價<input id="dispatchWorkQuote" name="workQuote" type="number" min="0" max="100000000" step="1" value="0"></label>

      <label class="wide">備註<textarea name="note" rows="3" maxlength="500" placeholder="交代事項、進場方式或其他說明"></textarea></label>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn text close-dispatch-dialog">取消</button>
      <button id="submitDispatchBtn" type="submit" class="btn primary">建立派工</button>
    </div>
  </form>
</dialog>
