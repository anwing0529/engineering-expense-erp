<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b63ce">
  <meta name="description" content="工程費用管理系統 ERP，提供員工報帳與工程費用管理。">
  <title>工程費用管理系統 ERP</title>
  <style>
    :root{
      --primary:#0b63ce;
      --primary-dark:#064b9e;
      --blue-50:#eef6ff;
      --surface:#fff;
      --background:#f3f7fc;
      --text:#132238;
      --muted:#66758a;
      --line:#dfe8f3;
      --success:#16865c;
      --radius:22px;
      --shadow:0 24px 70px rgba(19,49,89,.13);
    }
    *{box-sizing:border-box}
    html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--background);color:var(--text)}
    body{margin:0;min-height:100vh;background:
      radial-gradient(circle at 10% 0,rgba(74,158,255,.18),transparent 30%),
      radial-gradient(circle at 95% 85%,rgba(64,106,255,.10),transparent 28%),
      var(--background)}
    button,input{font:inherit}
    .shell{min-height:100vh;display:flex;flex-direction:column}
    .topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,.86);border-bottom:1px solid rgba(223,232,243,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:11px;font-weight:800;color:var(--primary)}
    .logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#1679e8,#064b9e);color:#fff;box-shadow:0 8px 18px rgba(11,99,206,.24)}
    .version{padding:6px 10px;border-radius:999px;background:var(--blue-50);color:var(--primary);font-size:12px;font-weight:700}
    main{width:min(1160px,calc(100% - 32px));margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center;padding:64px 0}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:#e8f3ff;color:var(--primary);font-size:13px;font-weight:800;letter-spacing:.04em}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 5px rgba(22,134,92,.12)}
    h1{font-size:clamp(38px,5vw,68px);line-height:1.08;letter-spacing:-.045em;margin:22px 0 18px}
    h1 span{display:block;color:var(--primary)}
    .lead{font-size:18px;line-height:1.8;color:var(--muted);max-width:620px;margin:0}
    .features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:30px 0 0;padding:0;list-style:none}
    .features li{display:flex;align-items:center;gap:10px;color:#405168;font-weight:650}
    .check{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:#e9f7f1;color:var(--success);font-size:14px;font-weight:900}
    .login-card{width:100%;max-width:440px;justify-self:end;background:rgba(255,255,255,.96);border:1px solid rgba(223,232,243,.95);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow)}
    .card-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:var(--blue-50);color:var(--primary);font-size:28px}
    h2{font-size:26px;margin:20px 0 7px}
    .card-copy{color:var(--muted);margin:0 0 24px;line-height:1.6}
    label{display:grid;gap:8px;margin-bottom:16px;font-size:14px;font-weight:700;color:#35475e}
    input{width:100%;height:48px;padding:0 14px;border:1px solid #cbd8e7;border-radius:12px;background:#fff;color:var(--text);outline:none;transition:.2s}
    input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(11,99,206,.11)}
    .login{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,#1679e8,#0753ad);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 22px rgba(11,99,206,.24);transition:.2s}
    .login:hover{transform:translateY(-1px);box-shadow:0 13px 28px rgba(11,99,206,.3)}
    .notice{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:#fff8e7;color:#805e10;font-size:13px;line-height:1.55}
    .privacy{text-align:center;color:#8794a6;font-size:12px;margin:18px 0 0}
    footer{text-align:center;padding:18px 24px 28px;color:#8794a6;font-size:13px}
    @media(max-width:860px){
      .topbar{padding:0 18px}
      main{grid-template-columns:1fr;gap:38px;text-align:center;padding:44px 0}
      .lead{margin-left:auto;margin-right:auto}
      .features{max-width:520px;margin-left:auto;margin-right:auto;text-align:left}
      .login-card{justify-self:center;text-align:left}
    }
    @media(max-width:520px){
      .topbar{height:62px}
      .brand span:last-child{font-size:14px}
      main{width:min(100% - 22px,1160px);padding:32px 0;gap:28px}
      h1{font-size:38px}
      .lead{font-size:16px}
      .features{grid-template-columns:1fr;gap:10px;margin-top:24px}
      .login-card{padding:24px 20px;border-radius:18px}
      .version{display:none}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="logo">費</span><span>工程費用管理系統</span></div>
      <span class="version">ERP v1.1.0</span>
    </header>

    <main>
      <section>
        <span class="eyebrow"><span class="dot"></span>系統展示頁</span>
        <h1>工程費用，<span>一站清楚管理</span></h1>
        <p class="lead">為中小型水電工程團隊設計的行動報帳系統，讓員工快速上傳收據，管理者即時掌握工程成本。</p>
        <ul class="features">
          <li><span class="check">✓</span>手機快速報帳</li>
          <li><span class="check">✓</span>收據圖片管理</li>
          <li><span class="check">✓</span>個人歷史紀錄</li>
          <li><span class="check">✓</span>工程成本統計</li>
        </ul>
      </section>

      <section class="login-card" aria-labelledby="login-title">
        <div class="card-icon">▤</div>
        <h2 id="login-title">員工登入</h2>
        <p class="card-copy">使用公司 Email 與管理員提供的 PIN 登入。</p>
        <form id="preview-form">
          <label>Email
            <input type="email" autocomplete="username" placeholder="name@company.com" required>
          </label>
          <label>登入 PIN
            <input type="password" inputmode="numeric" autocomplete="current-password" placeholder="請輸入 PIN" required>
          </label>
          <button class="login" type="submit">登入系統</button>
          <div id="notice" class="notice" role="status">這是 GitHub Pages 靜態展示頁。正式登入與報帳功能需由 Google Apps Script 網頁應用程式提供。</div>
        </form>
        <p class="privacy">資料由 Google Apps Script 與 Google Sheets 管理</p>
      </section>
    </main>

    <footer>© 2026 工程費用管理系統 ERP</footer>
  </div>
  <script>
    document.getElementById('preview-form').addEventListener('submit', function (event) {
      event.preventDefault();
      window.location.href = 'https://script.google.com/macros/s/AKfycbwS45IWDK01S2EnRchj6JG-ZrF0qxUe-M6bp80pX1b0sFXGUjo8cobZZ5wA2cnJRL0V/exec';
    });
  </script>
</body>
</html>
