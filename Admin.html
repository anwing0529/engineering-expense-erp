<div class="page-head">
  <div><p class="eyebrow">ADMIN</p><h2><span id="adminPageUserName"></span>｜管理總覽</h2><p>掌握工程、員工與費用成本</p></div>
  <div class="button-row">
    <button class="btn outlined export-btn" data-format="xlsx"><span class="material-symbols-rounded">table_view</span>Excel</button>
    <button class="btn outlined export-btn" data-format="pdf"><span class="material-symbols-rounded">picture_as_pdf</span>PDF</button>
  </div>
</div>

<div class="filters card">
  <label class="search-field"><span class="material-symbols-rounded">search</span><input id="adminKeyword" type="search" placeholder="搜尋員工、工程、品項、類別…"></label>
  <label><span class="sr-only">月份</span><input id="adminMonth" type="month"></label>
  <button id="clearFiltersBtn" class="btn text">清除篩選</button>
</div>

<div class="stat-grid admin-stats">
  <article class="stat-card"><span class="material-symbols-rounded blue">payments</span><div><small>篩選成本</small><strong id="filteredTotal">NT$ 0</strong></div></article>
  <article class="stat-card"><span class="material-symbols-rounded green">groups</span><div><small>員工人數</small><strong id="employeeCount">0</strong></div></article>
  <article class="stat-card"><span class="material-symbols-rounded amber">construction</span><div><small>工程數量</small><strong id="projectCount">0</strong></div></article>
  <article class="stat-card"><span class="material-symbols-rounded purple">receipt</span><div><small>報帳筆數</small><strong id="expenseCount">0</strong></div></article>
</div>

<div class="chart-grid">
  <section class="card"><h3>每月成本</h3><div id="monthlyChart" class="bar-chart"></div></section>
  <section class="card"><h3>每年成本</h3><div id="yearlyChart" class="bar-chart"></div></section>
  <section class="card"><h3>員工成本</h3><div id="employeeChart" class="bar-chart"></div></section>
  <section class="card"><h3>費用分類</h3><div id="categoryChart" class="bar-chart"></div></section>
</div>

<section class="card">
  <div class="card-title"><h3>全部報帳明細</h3><span id="resultCount" class="chip">0 筆</span></div>
  <div id="adminExpenseList" class="mobile-list"></div>
  <div class="table-wrap desktop-table">
    <table><thead><tr><th>日期</th><th>員工</th><th>工程</th><th>品項</th><th>類別</th><th class="right">金額</th><th>收據</th></tr></thead><tbody id="adminExpenseTable"></tbody></table>
  </div>
</section>
