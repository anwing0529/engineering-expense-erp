<div class="page-head">
  <div><p class="eyebrow">EMPLOYEE</p><h2><span id="employeePageUserName"></span>｜我的工單與報帳</h2><p>報工、拍照、上傳材料與送出請款資料</p></div>

</div>

<div class="stat-grid employee-stats">
  <article class="stat-card"><span class="material-symbols-rounded blue">payments</span><div><small>工單回報金額</small><strong id="myTotal">NT$ 0</strong></div></article>
  <article class="stat-card"><span class="material-symbols-rounded green">description</span><div><small>工單回報筆數</small><strong id="myCount">0</strong></div></article>
</div>

<section class="card work-order-section">
  <div class="card-title"><div><h3>我的派工任務</h3><p>點選卡片進入工單回報</p></div><button id="refreshWorkOrdersBtn" class="icon-btn" title="重新整理"><span class="material-symbols-rounded">refresh</span></button></div>
  <div id="employeeWorkOrderList" class="employee-work-orders"><div class="empty">正在載入派工任務…</div></div>
</section>

<section class="card dispatch-history-section">
  <div class="card-title">
    <div><h3>歷史派工記錄回查</h3><p>只顯示已完工且指派給我的工單</p></div>
    <button id="refreshMineBtn" class="icon-btn" title="重新整理"><span class="material-symbols-rounded">refresh</span></button>
  </div>
  <div id="employeeDispatchHistoryMobile" class="mobile-list"></div>
  <div class="table-wrap desktop-table">
    <table class="history-table"><thead><tr><th>日期</th><th>工程</th><th>地點</th><th>工作內容</th><th class="right">工程報價</th><th class="right">報帳金額</th><th class="right">合計</th></tr></thead><tbody id="employeeDispatchHistoryTable"></tbody></table>
  </div>
  <div class="history-load-row"><small id="employeeHistoryCount"></small><button id="loadMoreEmployeeHistoryBtn" type="button" class="btn outlined small hidden">再顯示 10 筆</button></div>
</section>

<dialog id="workReportDialog" class="work-report-dialog">
  <form id="workReportForm" method="dialog">
    <input id="workReportTaskId" name="taskId" type="hidden">
    <div class="dialog-head"><div><small id="workReportTaskCode"></small><h3 id="workReportTaskName">工單回報</h3></div><button type="button" class="icon-btn close-work-report"><span class="material-symbols-rounded">close</span></button></div>
    <a id="workReportAddress" class="dispatch-address" href="#" target="_blank" rel="noopener"></a>
    <div class="form-grid">
      <section class="form-section wide">
        <div class="section-title"><strong>工作內容<span>*</span></strong><small>完成的項目請打勾</small></div>
        <div id="workReportItems" class="report-work-items"></div>
      </section>
      <section class="form-section wide">
        <div class="section-title"><strong>報帳費用類別（選填）</strong><small>有費用時可複選</small></div>
        <div class="expense-category-options">
          <label><input type="checkbox" name="workReportCategory" value="工具設備"><span>工具設備</span></label>
          <label><input type="checkbox" name="workReportCategory" value="材料費"><span>材料費</span></label>
          <label><input type="checkbox" name="workReportCategory" value="外包工資"><span>外包工資</span></label>
          <label><input type="checkbox" name="workReportCategory" value="雜支"><span>雜支</span></label>
          <label><input type="checkbox" name="workReportCategory" value="__OTHER_EXPENSE__"><span>其它</span></label>
        </div>
        <label id="workReportOtherCategoryField" class="hidden">其它費用說明<span>*</span><textarea id="workReportOtherCategory" rows="4" maxlength="300" placeholder="可分行說明，例如：&#10;停車費 100 元&#10;垃圾清運 500 元"></textarea></label>
      </section>
      <label>報帳金額（選填）<input id="workReportMaterialAmount" name="materialAmount" type="number" inputmode="decimal" min="0" max="100000000" step="1" value="0" placeholder="沒有費用可留 0"></label>
      <label class="wide">註記內容<textarea id="workReportNote" name="note" rows="3" maxlength="500" placeholder="例如：牆面已補漆，浴室清潔完成"></textarea></label>
      <label class="wide">完工照片<span>*</span><input id="completionPhotoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>至少 1 張，最多 10 張；送出後會上傳 Google Drive</small></label>
      <div id="completionPhotoPreview" class="photo-preview-grid wide"><div class="photo-preview-placeholder"><span class="material-symbols-rounded">add_photo_alternate</span><span>選擇照片後在此預覽</span></div></div>
      <label class="wide">材料收據（選填）<input id="workReportReceiptInput" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple><small>沒有購買材料可不附；最多 10 個檔案，每個最大 8MB</small></label>
      <div id="workReportReceiptPreview" class="photo-preview-grid wide"></div>
    </div>
    <div class="dialog-actions"><button type="button" class="btn text close-work-report">取消</button><button id="submitWorkReportBtn" type="submit" class="btn primary">送出工單回報</button></div>
  </form>
</dialog>
<dialog id="expenseDialog">
  <form id="expenseForm" method="dialog">
    <div class="dialog-head"><h3>新增報帳</h3><button type="button" class="icon-btn close-dialog"><span class="material-symbols-rounded">close</span></button></div>
    <div class="form-grid">
      <label>日期<span>*</span><input id="expenseDate" name="date" type="date" required></label>
      <label>工程名稱<span>*</span><select id="expenseProject" name="project" required></select></label>
      <label id="customProjectField" class="hidden">其它工程名稱<span>*</span><input id="customProject" name="customProject" maxlength="100" placeholder="例如：台北市仁愛區公寓"></label>
      <label class="wide">品項<span>*</span><input name="item" maxlength="200" placeholder="例如：電線、螺絲、停車費" required></label>
      <label>類別<span>*</span><select id="expenseCategory" name="category" required></select></label>
      <label>金額<span>*</span><input name="amount" type="number" inputmode="decimal" min="1" max="100000000" step="1" placeholder="0" required></label>
      <label class="wide">收據圖片<span>*</span><input id="receiptInput" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required><small>JPG、PNG、WebP 或 PDF，最大 8MB</small></label>
      <div id="receiptPreview" class="receipt-preview wide hidden"></div>
      <label class="wide">備註<textarea name="note" rows="3" maxlength="500" placeholder="選填"></textarea></label>
    </div>
    <div class="dialog-actions"><button type="button" class="btn text close-dialog">取消</button><button id="submitExpenseBtn" type="submit" class="btn primary">送出報帳</button></div>
  </form>
</dialog>
